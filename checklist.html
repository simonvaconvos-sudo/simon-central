.checklist-box{margin:32px auto;padding:22px;max-width:900px;background:#fff;border:1px solid #e8cdd6;border-radius:18px;color:#333;box-shadow:0 4px 20px #0001}
.checklist-box h2,.checklist-box h3{margin:8px 0 12px}.checklist-box label{display:block}.checklist-box input:not([type=radio]),.checklist-box select,.checklist-box textarea{box-sizing:border-box;display:block;width:100%;padding:11px;margin:6px 0 12px;border:1px solid #bdbdbd;border-radius:9px;font:inherit;background:white;color:#252525}.checklist-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checklist-group{margin:18px 0;padding:14px;border:1px solid #e5e5e5;border-radius:12px}.checklist-line{padding:12px 0;border-top:1px solid #eee}.checklist-choices{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 0}.checklist-choices label{display:flex;align-items:center;gap:5px;font-size:.9rem}.checklist-choices input{accent-color:#a74369}.checklist-free{margin:16px 0}.checklist-actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.checklist-actions button{background:#a74369;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}.checklist-actions .checklist-secondary{background:#555}.checklist-error{color:#a71933;font-weight:700}.checklist-preview{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f4f5;padding:16px;border-radius:10px;max-height:400px;overflow:auto}.checklist-disclaimer{font-size:.85rem;color:#666}@media(max-width:600px){.checklist-box{padding:14px}.checklist-fields{grid-template-columns:1fr}.checklist-choices{gap:12px}}

/* V23: entrada visible al checklist */
.checklist-entry{margin:20px 0}.checklist-open{display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;background:#fff7fa;border:2px solid #d9a6bb;border-radius:14px;padding:20px;color:#333;cursor:pointer}.checklist-open strong{font-size:1.2rem}.checklist-open .bottom{color:#9d4267;font-weight:700}.checklist-box[hidden]{display:none!important}

body{background:#faf8f7}main{max-width:920px;margin:25px auto;padding:0 16px}.checklist-box{display:block!important}header{padding:20px;text-align:center;background:#454047;color:white}header img{width:68px;vertical-align:middle;margin-right:12px}header a{color:#fff}#turno-checklist{margin:15px auto}</style></head><body><header><img src="/logo-simon.png" alt="Simón"><strong>SIMÓN CENTRAL · LOCAL DE POCHOCLOS</strong><p><a href="/">← Volver al catálogo</a></p></header><main><section id="turno-checklist" class="checklist-box"></section></main><script>// V19 — Control de finalización de turno. No altera recetas ni temporizadores.
(function(){
const groups=[
 {title:'Reposición y control',items:['Bebidas','Sándwiches','Ensaladas de frutas','Pochoclos','Garrapiñadas','Frutas','Orden de heladeras','Revisión de etiquetas y vencimientos','Revisión de temperatura de equipos de frío (sin ingresar grados)','Rotación de mercadería por vencimiento','Vasos, tapas y servilletas']},
 {title:'Limpieza',items:['Mostrador','Bacha','Licuadora','Piso de cocina','Exhibidoras','Debajo de exhibidoras','Vidrios','Sobre exhibidoras','Cestos de residuos','Olla pochoclera']},
 {title:'Equipos y cierre',items:['Apagado de luces interiores']}
];
const key='simon-central-pochoclos-checklist-v1';let draft={};try{draft=JSON.parse(sessionStorage.getItem(key)||'{}')||{}}catch{}
const root=document.getElementById('turno-checklist');if(!root)return;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(name)=>esc(draft[name]||'');
function store(){try{sessionStorage.setItem(key,JSON.stringify(draft))}catch{}}
function render(){
 root.innerHTML=`<div class="checklist-head"><p class="eyebrow">CONTROL DEL LOCAL</p><h2>Checklist · Local de Pochoclos</h2><p>Registrá cómo dejás el local. Al terminar, prepará el informe para compartirlo en el grupo de WhatsApp.</p></div>
 <div class="checklist-fields"><label>Empleado responsable <input data-field="empleado" maxlength="100" required value="${field('empleado')}" placeholder="Nombre y apellido"></label><label>Turno <select data-field="turno"><option value="">Seleccionar turno</option>${['Mañana','Tarde','Noche'].map(x=>`<option ${draft.turno===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
 <label class="checklist-free"><strong>1. Producción del turno</strong><textarea data-field="produccion" rows="3" placeholder="Qué se produjo y cantidades">${field('produccion')}</textarea></label>
 ${groups.map((g,gi)=>`<section class="checklist-group"><h3>${gi+2}. ${esc(g.title)}</h3>${g.items.map((item,i)=>{const id=`${gi}-${i}`,value=draft['status-'+id]||'';return `<div class="checklist-line"><strong>${esc(item)}</strong><div class="checklist-choices">${[['ok','Correcto'],['issue','Con problema'],['pending','Pendiente'],['na','No corresponde']].map(([v,label])=>`<label><input type="radio" name="control-${id}" data-status="${id}" value="${v}" ${value===v?'checked':''}> ${label}</label>`).join('')}</div>${value==='issue'?`<label class="checklist-obs">Observación obligatoria <input data-field="obs-${id}" value="${field('obs-'+id)}" placeholder="Describir el problema"></label>`:''}</div>`}).join('')}</section>`).join('')}
 <label class="checklist-free"><strong>Faltantes</strong><textarea data-field="faltantes" rows="3" placeholder="Productos faltantes y cantidades; escribir Sin faltantes si corresponde">${field('faltantes')}</textarea></label>
 <label class="checklist-free"><strong>Ingreso de mercadería</strong><textarea data-field="ingresos" rows="3" placeholder="Productos recibidos y cantidades; escribir Sin ingresos si corresponde">${field('ingresos')}</textarea></label>
 <p id="checklist-error" class="checklist-error" role="alert"></p><div class="checklist-actions"><button type="button" id="checklist-generate">Preparar informe</button><button type="button" id="checklist-clear" class="checklist-secondary">Nuevo control</button></div><div id="checklist-report" hidden></div><p class="checklist-disclaimer">Este formulario guarda un borrador solo en esta pestaña. El informe no se envía ni se guarda en un servidor: el empleado elige el grupo y confirma el envío en WhatsApp.</p>`;
 root.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{draft[el.dataset.field]=el.value;store()}));
 root.querySelectorAll('[data-status]').forEach(el=>el.addEventListener('change',()=>{draft['status-'+el.dataset.status]=el.value;store();const focused=el.dataset.status;render();const target=root.querySelector(`[name="${focused==='filtrado'?'filtrado':'control-'+focused}"][value="${el.value}"]`);target?.focus()}));
 root.querySelector('#checklist-generate').addEventListener('click',generate);
 root.querySelector('#checklist-clear').addEventListener('click',()=>{if(!confirm('¿Empezar un control nuevo? Se borrará el borrador actual de esta pestaña.'))return;draft={};store();render()});
}
function generate(){const err=root.querySelector('#checklist-error');err.textContent='';if(!String(draft.empleado||'').trim()||!draft.turno){err.textContent='Indicá el nombre del empleado y el turno.';return}
 const missing=[],problems=[],ok=[],pending=[],na=[];
 for(let gi=0;gi<groups.length;gi++)for(let i=0;i<groups[gi].items.length;i++){const id=`${gi}-${i}`,label=groups[gi].items[i],status=draft['status-'+id],note=String(draft['obs-'+id]||'').trim();if(!status)missing.push(label);else if(status==='issue'){if(!note)missing.push('Observación de '+label);else problems.push(label+': '+note)}else if(status==='ok')ok.push(label);else if(status==='pending')pending.push(label);else na.push(label)}
if(missing.length){err.textContent='Falta completar: '+missing.slice(0,5).join(', ')+(missing.length>5?' y '+(missing.length-5)+' más':'')+'. Podés marcar No corresponde cuando corresponda.';return}

 const lines=[`SIMÓN CENTRAL — POCHOCLOS · CIERRE DE TURNO`,`Fecha: ${new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Argentina/Mendoza'}).format(new Date())}`,`Responsable: ${draft.empleado.trim()}`,`Turno: ${draft.turno}`,'',`⚠ PROBLEMAS (${problems.length})`,...(problems.length?problems.map(x=>'• '+x):['Sin problemas informados']),'',`FALTANTES`,String(draft.faltantes||'Sin datos informados').trim()||'Sin datos informados','',`INGRESOS DE MERCADERÍA`,String(draft.ingresos||'Sin datos informados').trim()||'Sin datos informados','',`PRODUCCIÓN DEL TURNO`,String(draft.produccion||'Sin datos informados').trim()||'Sin datos informados','',`PENDIENTES (${pending.length})`,...(pending.length?pending.map(x=>'• '+x):['Ninguno']),'',`VERIFICACIONES CORRECTAS (${ok.length})`,...ok.map(x=>'✓ '+x),'',`NO CORRESPONDE (${na.length})`,...na.map(x=>'– '+x)];const report=lines.join('\n');const panel=root.querySelector('#checklist-report');panel.hidden=false;panel.innerHTML=`<h3>Informe listo para compartir</h3><pre class="checklist-preview"></pre><div class="checklist-actions"><button id="checklist-copy" type="button">Copiar informe</button><button id="checklist-share" type="button">Compartir por WhatsApp</button></div>`;panel.querySelector('pre').textContent=report;panel.querySelector('#checklist-copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);err.textContent='Informe copiado.'}catch{err.textContent='Seleccioná y copiá el informe manualmente.'}};panel.querySelector('#checklist-share').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(report),'_blank','noopener,noreferrer');panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
render();
})();

// V23: navegación unificada, sin handlers antiguos ni dependencias del listado.
(function(){
 const tab=document.getElementById('tab-checklist');
 const panel=document.getElementById('turno-checklist');
 const list=document.getElementById('manual-lista');
 const search=document.getElementById('buscar-manual');
 const manualTab=document.getElementById('tab-manual');
 const recipesTab=document.getElementById('tab-recetas');
 if(!tab||!panel||!list||!search)return;
 function showChecklist(){
   cambiarSeccion('manual');
   list.hidden=true;search.hidden=true;
   panel.hidden=false;
   tab.classList.add('selected');manualTab.classList.remove('selected');
   panel.scrollIntoView({block:'start'});
 }
 function showManual(){
   panel.hidden=true;list.hidden=false;search.hidden=false;
   tab.classList.remove('selected');
 }
 tab.addEventListener('click',showChecklist);
 manualTab.addEventListener('click',showManual);
 recipesTab.addEventListener('click',showManual);
 const entry=document.getElementById('open-turno-checklist');
 if(entry)entry.addEventListener('click',showChecklist);
 const back=document.getElementById('close-turno-checklist');
 if(back)back.addEventListener('click',()=>{showManual();manualTab.click()});
})();</script></body></html>
